    <circle cx="706" cy="336" r="46" fill="none" stroke="#FAF9F7" stroke-width="26"/>
    <circle cx="706" cy="336" r="33" fill="#D9480F"/>

    <circle cx="706" cy="744" r="46" fill="none" stroke="#FAF9F7" stroke-width="26"/>
    <circle cx="706" cy="744" r="33" fill="#D9480F"/>
