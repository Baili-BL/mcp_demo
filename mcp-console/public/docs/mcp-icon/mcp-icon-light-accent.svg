<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MCP Service Icon — Light / Accent -->
  <!-- Squircle container -->
  <rect x="8" y="8" width="1008" height="1008" rx="230" fill="#FAF9F7"/>
  <rect x="8" y="8" width="1008" height="1008" rx="230" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="3"/>

  <!-- M as connection topology -->
